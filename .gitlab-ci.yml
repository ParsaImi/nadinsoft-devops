stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE_NAME: parsaimi/demo-app:1.0
  DOCKER_IMAGE_TAG: 1.0

before_script:
  - docker --version

test:
  stage: test
  image: python:3.9-slim-buster
  before_script:
    - cd app
    - pip install -r requirements.txt
    - pip install pytest
  script:
    - pytest test_app.py -v
  artifacts:
    reports:
      junit: app/test-results.xml
  coverage: '/TOTAL.*\s+(\d+%)$/'

build:
  stage: build
  image: docker:28.3.3
  services:
    - docker:20.3.3-dind
  before_script:
    - docker login -username $REGISTRY_USER --password $REGISTERY_PASS
  script:
    
    - docker build -t $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG .
    - docker push $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG
    - echo "Image pushed to $DOCKER_IMAGE_NAME:$DOCKER_IMAGE_TAG"
  only:
    - main
    - develop

deploy:
  stage: deploy
  image: docker:20.10.16
  services:
    - docker:20.10.16-dind
  script:
    - echo "Deploying to production..."
    - docker login -username $REGISTRY_USER --password $REGISTRY_PASS
    - docker-compose down || true
    - docker-compose pull
    - docker-compose up -d
    - sleep 30
    - docker-compose ps
    - curl -f http://localhost:5000/ || exit 1
  only:
    - main
  when: manual
