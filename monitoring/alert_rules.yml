groups:
  - name: django_app_alerts
    rules:
      # 1. App is completely down
      - alert: DjangoAppDown
        expr: up{job="django-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Django application is down"
          description: "The Django app has been unreachable for 30+ seconds"

      # 2. High response time (slow performance)
      - alert: SlowResponse
        expr: django_http_request_duration_seconds{quantile="0.95"} > 1
        for: 1m
        labels:
          severity: warning
        annotations:
          summary: "Slow response time detected"
          description: "95% of requests are taking longer than 1 second"

      # 3. High error rate (5xx errors)
      - alert: HighErrorRate
        expr: rate(django_http_responses_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "High error rate detected"
          description: "More than 5% of requests are returning 5xx errors"

      # 4. Too many requests (potential DDoS)
      - alert: HighRequestRate
        expr: rate(django_http_requests_total[5m]) > 100
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "High request rate detected"
          description: "Receiving more than 100 requests per second"
