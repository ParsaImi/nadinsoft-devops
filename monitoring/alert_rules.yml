groups:
  - name: django_app_alerts
    rules:
      # 1. App is completely down
      - alert: DjangoAppDown
        expr: up{job="django-app"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "Django application is down"
          description: "The Django app has been unreachable for 10+ seconds"


      # 2. High response time (slow performance)
      - alert: HighResponseTime
        expr: histogram_quantile(0.95, rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])) > 0.5
        for: 10s
        labels:
          severity: warning
        annotations:
          summary: "High response time detected"
          description: "95% of requests are taking more than 0.5 seconds."
